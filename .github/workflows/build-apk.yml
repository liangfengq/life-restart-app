name: Build Android APK

# 触发：推送到 main/master 分支，或手动在 Actions 页面点 "Run workflow"
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 17 (AGP 8.x 要求)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK（ANDROID_HOME + sdkmanager），无需额外 setup

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages (compileSdk 34 + build-tools)
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor native project
        run: npx cap sync android

      - name: Build debug APK (免签名，个人自用直接装)
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-restart-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
